# The dsh-plugins composition layer: one loader row per plugin. Adding a
# plugin means adding a subpath export and one row here — the profile's
# bundle list never grows past this single package.

- insert:
    # `/effort`: the agent-owned reasoning effort, switched through the
    # durable model selection and, with an interactive frontend mounted,
    # through the effort-picker waterfall that terminal frontends answer.
    - id: command-effort
      name: 'dsh-plugins/effort'

    # `/model`: the agent-owned model route, switched through the same durable
    # model selection and, with an interactive frontend mounted, through the
    # model-picker waterfall it answers.
    - id: command-model
      name: 'dsh-plugins/model'

    # `/context`: the session's token report, folded from the log — a fill
    # grid, the window's used/free shares, and the turn/step activity.
    - id: command-context
      name: 'dsh-plugins/context'